<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Погода</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
    <div class="card">
        <span class="location">Чернівці</span>
        <span class="day">17</span>
    </div>
    <div class="cloud"></div>
    <div class="arrows">
        <a class="arrow" href="#">&larr;</a>
        <a class="arrow" href="#">&rarr;</a>
    </div>
    <ul class="forecast">
        <li class="forecast-day"><span class="forecast-name">Mon</span>17°</li>
        <li class="forecast-day"><span class="forecast-name">Tue</span>19°</li>
        <li class="forecast-day"><span class="forecast-name">Wed</span>16°</li>
        <li class="forecast-day"><span class="forecast-name">Thu</span>18°</li>
        <li class="forecast-day"><span class="forecast-name">Fri</span>21°</li>
    </ul>
</div>
</body>
</html>

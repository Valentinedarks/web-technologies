<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Popup</title>
    <link rel="icon" href="icons/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <a class="header-link" href="#">Mail</a>
    <a class="header-link" href="#">Images</a>
    <input class="popup-button" type="checkbox" aria-label="Apps">
    <div class="popup">
        <input class="popup-more" type="checkbox" aria-label="More">
        <div class="popup-scroll" tabindex="0">
            <div class="apps">
                <a class="app" href="#"><span class="app-icon app-icon--calendar"></span><span class="app-name">Calendar</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--mail"></span><span class="app-name">Mail</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--news"></span><span class="app-name">News</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--map"></span><span class="app-name">Map</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--files"></span><span class="app-name">Files</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--contacts"></span><span class="app-name">Contacts</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--translate"></span><span class="app-name">Translate</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--videos"></span><span class="app-name">Videos</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--search"></span><span class="app-name">Search</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--photo"></span><span class="app-name">Photo</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--apps"></span><span class="app-name">Apps</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--doc"></span><span class="app-name">Document</span></a>
            </div>
            <div class="apps apps--extra">
                <a class="app" href="#"><span class="app-icon app-icon--chat"></span><span class="app-name">Chat</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--class"></span><span class="app-name">Classroom</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--collection"></span><span class="app-name">Collection</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--mars"></span><span class="app-name">Mars</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--blogs"></span><span class="app-name">Blogs</span></a>
                <a class="app" href="#"><span class="app-icon app-icon--promos"></span><span class="app-name">Promos</span></a>
                <a class="apps-footer" href="#">Even more from Kottans</a>
            </div>
        </div>
    </div>
    <a class="header-icon" href="#" aria-label="Notifications"></a>
    <a class="header-avatar" href="#" aria-label="Profile">👤</a>
</div>
</body>
</html>

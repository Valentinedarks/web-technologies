<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Мондріан (Оновлено)</title>
</head>
<body>
    <div align="center">
        <a href="../index.html">Повернутись на головну</a><br><br>
        
        <!-- Загальна таблиця з чорним фоном створює лінії -->
        <table border="0" cellspacing="10" cellpadding="0" bgcolor="#000000">
            <!-- Рядок 1: Верхня смуга -->
            <tr>
                <td bgcolor="#FFFFFF" width="80" height="80"></td>
                <td bgcolor="#FFFFFF" colspan="2" width="250" height="80"></td>
                <td bgcolor="#ffdd00" colspan="2" width="140" height="80"></td> <!-- Жовтий блок справа -->
            </tr>
            
            <!-- Рядок 2: Початок великого червоного блоку -->
            <tr>
                <td bgcolor="#FFFFFF" rowspan="2" width="80" height="250"></td>
                <td bgcolor="#ff4020" rowspan="2" colspan="2" width="250" height="250"></td> <!-- Червоний блок -->
                <td bgcolor="#FFFFFF" width="70" height="120"></td>
                <td bgcolor="#FFFFFF" width="70" height="120"></td>
            </tr>
            
            <!-- Рядок 3: Нижня половина правих білих блоків (червоний продовжується) -->
            <tr>
                <td bgcolor="#FFFFFF" width="70" height="130"></td>
                <td bgcolor="#FFFFFF" width="70" height="130"></td>
            </tr>
            
            <!-- Рядок 4: Блоки під червоним -->
            <tr>
                <td bgcolor="#ffdd00" rowspan="2" width="80" height="140"></td> <!-- Жовтий блок зліва -->
                <td bgcolor="#1a1a1a" width="150" height="100"></td> <!-- Чорний квадрат -->
                <td bgcolor="#FFFFFF" width="100" height="100"></td>
                <td bgcolor="#003399" rowspan="2" colspan="2" width="140" height="140"></td> <!-- Синій блок -->
            </tr>
            
            <!-- Рядок 5: Самий низ під червоним блоком -->
            <tr>
                <td bgcolor="#FFFFFF" width="150" height="40"></td>
                <td bgcolor="#1a1a1a" width="100" height="40"></td> <!-- Чорний прямокутник знизу -->
            </tr>
        </table>
    </div>
</body>
</html>

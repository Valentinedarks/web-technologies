<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4 - Анкета</title>
</head>
<body>
    <div align="center">
        <a href="../index.html">Повернутись на головну</a><br><br>
        
        <!-- Таблиця для вирівнювання форми по лівому краю, але по центру екрану -->
        <table width="600">
            <tr>
                <td align="left">
                    <form action="" method="post" enctype="multipart/form-data">
                        <fieldset>
                            <legend>Особиста інформація</legend>
                            <label for="fname">Ім'я:</label>
                            <input type="text" id="fname" name="first_name" placeholder="Введіть ім'я" required tabindex="1"><br><br>
                            
                            <label for="email">Email (вимкнено автозаповнення):</label>
                            <input type="email" id="email" name="user_email" autocomplete="off" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" placeholder="example@mail.com" required tabindex="2"><br><br>
                            
                            <label for="tel">Телефон:</label>
                            <input type="tel" id="tel" name="user_tel" pattern="[0-9]{10}" placeholder="0991234567" tabindex="3"><br><br>
                            
                            <label for="pwd">Пароль (мін. 6 символів):</label>
                            <input type="password" id="pwd" name="user_pwd" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}" required tabindex="4"><br><br>
                            
                            <label for="bdate">Дата народження:</label>
                            <input type="date" id="bdate" name="birth_date" tabindex="5">
                        </fieldset>

                        <fieldset>
                            <legend>Вибір опцій</legend>
                            <label>Курс (Блок 1):</label><br>
                            <input type="radio" id="c1" name="course" value="1" tabindex="6"><label for="c1">1</label>
                            <input type="radio" id="c2" name="course" value="2"><label for="c2">2</label>
                            <input type="radio" id="c3" name="course" value="3"><label for="c3">3</label><br><br>
                            
                            <label>Форма навчання (Блок 2):</label><br>
                            <input type="radio" id="f1" name="edu_form" value="денна" checked tabindex="7"><label for="f1">Денна</label>
                            <input type="radio" id="f2" name="edu_form" value="заочна"><label for="f2">Заочна</label>
                            <input type="radio" id="f3" name="edu_form" value="дульна"><label for="f3">Дуальна</label><br><br>

                            <label>Інтереси (Checkboxes):</label><br>
                            <input type="checkbox" id="int1" name="interests" value="sport" tabindex="8"><label for="int1">Спорт</label>
                            <input type="checkbox" id="int2" name="interests" value="music"><label for="int2">Музика</label>
                            <input type="checkbox" id="int3" name="interests" value="it"><label for="int3">IT</label>
                            <input type="checkbox" id="int4" name="interests" value="art"><label for="int4">Мистецтво</label>
                        </fieldset>

                        <fieldset>
                            <legend>Списки та файли</legend>
                            <label for="faculty">Факультет (1 з 5):</label>
                            <select id="faculty" name="faculty_select" tabindex="9">
                                <option value="f1">ФІТ</option>
                                <option value="f2">ФЕМ</option>
                                <option value="f3" selected>КН</option>
                                <option value="f4">ЮФ</option>
                                <option value="f5">ІФ</option>
                            </select><br><br>

                            <label for="langs">Мови (множинний вибір):</label><br>
                            <select id="langs" name="languages" multiple tabindex="10" size="4">
                                <option value="js">JavaScript</option>
                                <option value="py">Python</option>
                                <option value="cpp">C++</option>
                                <option value="java">Java</option>
                            </select><br><br>

                            <label for="cities">Місто (з optgroup):</label>
                            <select id="cities" name="city" tabindex="11">
                                <optgroup label="Захід">
                                    <option value="lviv">Львів</option>
                                    <option value="cv">Чернівці</option>
                                </optgroup>
                                <optgroup label="Центр">
                                    <option value="kyiv">Київ</option>
                                    <option value="vin">Вінниця</option>
                                </optgroup>
                            </select><br><br>

                            <label for="browser">Браузер (з підказками):</label>
                            <input list="browsers" id="browser" name="browser" tabindex="12">
                            <datalist id="browsers">
                                <option value="Chrome">
                                <option value="Firefox">
                                <option value="Safari">
                            </datalist><br><br>

                            <label for="about">Про себе:</label><br>
                            <textarea id="about" name="about_text" rows="4" cols="50" placeholder="Напишіть кілька слів..." tabindex="13"></textarea><br><br>

                            <label for="audiofile">Завантажити аудіо (множинне):</label>
                            <input type="file" id="audiofile" name="audio_files" accept="audio/*" multiple tabindex="14">
                        </fieldset>

                        <button type="submit" formmethod="get" tabindex="15">Відправити (GET)</button>
                        <button type="submit" formmethod="post" tabindex="16">Відправити (POST)</button>
                        <button type="reset" tabindex="17">Очистити</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>

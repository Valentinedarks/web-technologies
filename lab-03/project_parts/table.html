<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Таблиця (Оновлено)</title>
</head>
<body>
    <div align="center">
        <a href="../index.html">Повернутись на головну</a><br><br>
        
        <table border="2" bordercolor="black" cellspacing="0" cellpadding="0" width="300" height="300">
            <!-- Рядок 1: Верхня зовнішня бірюзова смуга (на всю ширину) -->
            <tr>
                <td colspan="6" bgcolor="#40E0D0" height="50"></td>
            </tr>
            
            <!-- Рядок 2: Початок лівої/правої зовнішніх світло-жовтих смуг та верхня внутрішня бірюзова смуга -->
            <tr>
                <td rowspan="4" bgcolor="#FFFACD" width="50"></td>
                <td colspan="4" bgcolor="#40E0D0" height="50"></td>
                <td rowspan="4" bgcolor="#FFFACD" width="50"></td>
            </tr>
            
            <!-- Рядок 3: Початок внутрішніх світло-жовтих смуг та верхня частина кольорового центру -->
            <tr>
                <td rowspan="2" bgcolor="#FFFACD" width="50"></td>
                <td bgcolor="red" width="50" height="50"></td>
                <td bgcolor="blue" width="50" height="50"></td>
                <td rowspan="2" bgcolor="#FFFACD" width="50"></td>
            </tr>
            
            <!-- Рядок 4: Нижня частина кольорового центру -->
            <tr>
                <td bgcolor="#32CD32" width="50" height="50"></td>
                <td bgcolor="yellow" width="50" height="50"></td>
            </tr>
            
            <!-- Рядок 5: Нижня внутрішня бірюзова смуга -->
            <tr>
                <td colspan="4" bgcolor="#40E0D0" height="50"></td>
            </tr>
            
            <!-- Рядок 6: Нижня зовнішня бірюзова смуга (на всю ширину) -->
            <tr>
                <td colspan="6" bgcolor="#40E0D0" height="50"></td>
            </tr>
        </table>
    </div>
</body>
</html>

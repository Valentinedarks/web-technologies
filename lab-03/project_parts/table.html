<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Таблиця</title>
</head>
<body>
    <div align="center">
        <a href="../index.html">Повернутись на головну</a><br><br>
        
        <table border="2" bordercolor="black" cellspacing="0" cellpadding="0">
            <!-- Верхня блакитна смуга -->
            <tr><td colspan="6" bgcolor="#40E0D0" width="300" height="50"></td></tr>
            
            <tr>
                <td rowspan="4" bgcolor="#40E0D0" width="50" height="200"></td>
                <td colspan="4" bgcolor="#FFFACD" width="200" height="50"></td>
                <td rowspan="4" bgcolor="#40E0D0" width="50" height="200"></td>
            </tr>
            
            <tr>
                <td rowspan="2" bgcolor="#FFFACD" width="50" height="100"></td>
                <td colspan="2" bgcolor="#40E0D0" width="100" height="50"></td>
                <td rowspan="2" bgcolor="#FFFACD" width="50" height="100"></td>
            </tr>
            
            <tr>
                <!-- Центральний кольоровий квадрат (вкладена таблиця) -->
                <td colspan="2" width="100" height="50">
                    <table border="1" bordercolor="black" cellspacing="0" cellpadding="0" width="100%" height="100%">
                        <tr>
                            <td bgcolor="red" width="50" height="25"></td>
                            <td bgcolor="blue" width="50" height="25"></td>
                        </tr>
                        <tr>
                            <td bgcolor="#32CD32" width="50" height="25"></td>
                            <td bgcolor="yellow" width="50" height="25"></td>
                        </tr>
                    </table>
                </td>
            </tr>
            
            <tr><td colspan="4" bgcolor="#FFFACD" width="200" height="50"></td></tr>
            
            <!-- Нижня блакитна смуга -->
            <tr><td colspan="6" bgcolor="#40E0D0" width="300" height="50"></td></tr>
        </table>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №5 — Завдання 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form action="#" method="post">
    <h1>Анкета</h1>
    <fieldset>
        <legend>Особисті дані</legend>
        <p><label>Ім’я: <input type="text" name="name"></label></p>
        <p><label>Email: <input type="email" name="email"></label></p>
        <p>Стать:
            <label><input type="radio" name="gender" value="m"> чоловіча</label>
            <label><input type="radio" name="gender" value="f"> жіноча</label>
        </p>
        <p><label>Вік:
            <select name="age"><option>до 18</option><option>18–30</option><option>31–50</option><option>50+</option></select>
        </label></p>
    </fieldset>
    <fieldset>
        <legend>Інтереси</legend>
        <p>
            <label><input type="checkbox"> Програмування</label>
            <label><input type="checkbox"> Дизайн</label>
            <label><input type="checkbox"> Музика</label>
        </p>
        <p><label>Коментар:<br><textarea name="comment" rows="4" cols="40"></textarea></label></p>
    </fieldset>
    <p><input type="submit" value="Надіслати"> <input type="reset" value="Очистити"></p>
</form>
</body>
</html>
